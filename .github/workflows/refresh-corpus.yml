name: Refresh question corpus

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Also refreshes current-affairs questions, which expire and are rebuilt
      # rather than retained, so the schedule doubles as the currency guarantee.
      - name: Gather and normalize questions
        env:
          WIKIDATA_BATCH_SIZE: 24
        run: node tools/build-corpus.mjs

      - name: Publish updated corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kbc-corpus.json
          git diff --cached --quiet || git commit -m "chore: refresh question corpus"
          git push